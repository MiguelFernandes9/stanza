<script type="text/babel" data-presets="react">

const { useState } = React;

const Search = () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>);

  const [auto, setAuto] = useState(true);
  const [stage, setStage] = useState(true);

    <div>

        <span className="lbl">Buttons</span>
