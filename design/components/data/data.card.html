<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { Card, Avatar, Kbd, SegmentedControl, Badge, IconButton } = window.StanzaDesignSystem_d6c63d;
const { useState } = React;
const X = () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>);

function Demo() {
  const [view, setView] = useState('inline');
  return (
    <div className="grid">
      <div>
        <div className="row"><span className="lbl">Avatars</span>
          <Avatar claude /><Avatar name="Miguel Fernandes" /><Avatar name="Ana Reis" size={28} />
        </div>
        <div className="row"><span className="lbl">Keys</span>
          <span style={{display:'inline-flex',gap:4}}><Kbd>⌘</Kbd><Kbd>↵</Kbd></span>
          <span style={{color:'var(--ink-400)',fontSize:13}}>apply</span>
          <span style={{display:'inline-flex',gap:4}}><Kbd>⌘</Kbd><Kbd>R</Kbd></span>
          <span style={{color:'var(--ink-400)',fontSize:13}}>compile</span>
        </div>
        <div className="row"><span className="lbl">Segmented</span>
          <SegmentedControl value={view} onChange={setView}

          reference to §3.
