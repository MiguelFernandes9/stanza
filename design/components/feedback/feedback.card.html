<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-app); padding: 22px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .lbl { font: var(--weight-bold) var(--text-2xs)/1 var(--font-sans); letter-spacing: var(--tracking-caps);
         text-transform: uppercase; color: var(--text-faint); width: 100%; margin-bottom: -4px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { Badge, StatusDot, Tooltip, Toast, IconButton, Button } = window.StanzaDesignSystem_d6c63d;
const Refresh = () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M21 21v-5h5"/></svg>);
const CheckCircle = () => (<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.8 10A10 10 0 1 1 17 3.3"/><path d="m9 11 3 3L22 4"/></svg>);

function Demo() {
  return (
    <div>
      <div className="row">
        <span className="lbl">Badges</span>
        <Badge tone="accent" dot>Claude</Badge>
        <Badge tone="add">+12</Badge>
        <Badge tone="del">−4</Badge>
        <Badge tone="neutral">equation</Badge>
        <Badge tone="warn" variant="solid">2 warnings</Badge>
        <Badge tone="info">SyncTeX</Badge>
        <Badge tone="accent" variant="solid">§ 3.2</Badge>
      </div>
      <div className="row">
        <span className="lbl">Status &amp; Tooltip</span>
        <StatusDot tone="ok" label="Compiled · 0 errors" />
        <StatusDot tone="busy" pulse label="Claude is editing…" />
        <StatusDot tone="error" label="3 errors" />
        <Tooltip label="Recompile" hint="⌘R" side="bottom">
          <IconButton label="Recompile"><Refresh/></IconButton>
        </Tooltip>
      </div>
      <div className="row">
        <span className="lbl">Toast</span>
        <Toast tone="success" icon={<CheckCircle/>} title="Edit accepted"
          message="Committed to sections/intro.tex" onDismiss={()=>{}}
          action={<Button size="sm" variant="ghost">Undo</Button>} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
