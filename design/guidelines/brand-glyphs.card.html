<!-- @dsCard group="Brand" viewport="700x170" name="Structural Glyphs" subtitle="Document-structure marks that label addressable blocks" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-app); padding:20px; }
  .row { display:flex; gap:12px; }
  .g { flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 0; background:var(--paper-1); border:1px solid var(--border-default); border-radius:var(--radius-md); }
  .glyph { font:var(--weight-semibold) 30px/1 var(--font-serif); color:var(--clay-600); }
  .name { font:var(--weight-semibold) var(--text-2xs)/1 var(--font-sans); color:var(--ink-700); }
  .sub { font:var(--text-2xs)/1 var(--font-mono); color:var(--ink-400); }
</style></head><body>
  <div class="row">
    <div class="g"><div class="glyph">§</div><div class="name">Section</div><div class="sub">section</div></div>
    <div class="g"><div class="glyph">¶</div><div class="name">Paragraph</div><div class="sub">paragraph</div></div>
    <div class="g"><div class="glyph">∑</div><div class="name">Equation</div><div class="sub">equation</div></div>
    <div class="g"><div class="glyph">❏</div><div class="name">Figure</div><div class="sub">figure</div></div>
    <div class="g"><div class="glyph">▦</div><div class="name">Table</div><div class="sub">table</div></div>
    <div class="g"><div class="glyph">†</div><div class="name">Citation</div><div class="sub">citation</div></div>
  </div>
</body></html>
