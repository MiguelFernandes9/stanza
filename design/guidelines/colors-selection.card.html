<!-- @dsCard group="Colors" viewport="700x150" name="Selection & Block Highlight" subtitle="How a block reads when hovered and selected in the PDF" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-app); padding:18px; font-family:var(--font-paper); }
  .page { background:var(--paper-2); border:1px solid var(--border-default); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:9px; }
  .blk { padding:6px 9px; border-radius:var(--radius-sm); color:var(--ink-900); font-size:var(--text-md); line-height:1.5; }
  .hover { background:var(--hover-fill); box-shadow:inset 0 0 0 1px var(--hover-edge); }
  .sel { background:var(--select-fill); box-shadow:inset 0 0 0 1.5px var(--select-edge); }
  .tag { font:var(--weight-bold) var(--text-2xs)/1 var(--font-sans); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-400); }
  .tag.s { color:var(--clay-600); }
</style></head><body>
  <div class="page">
    <div class="blk"><span class="tag">Rest</span> &nbsp;The energy of the system is conserved.</div>
    <div class="blk hover"><span class="tag">Hover</span> &nbsp;We define the Lagrangian as follows.</div>
    <div class="blk sel"><span class="tag s">Selected</span> &nbsp;Substituting (3) into (4) yields the result.</div>
  </div>
</body></html>
