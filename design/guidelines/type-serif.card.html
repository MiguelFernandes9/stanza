<!-- @dsCard group="Type" viewport="700x190" name="Newsreader — Serif Voice" subtitle="The scholarly 'paper' voice: display, headings, reading" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-app); padding:22px; }
  .stack { display:flex; flex-direction:column; gap:6px; }
  .big { font:var(--weight-semibold) 46px/1.05 var(--font-serif); letter-spacing:var(--tracking-tight); color:var(--ink-900); }
  .lead { font:var(--weight-regular) var(--text-lg)/1.5 var(--font-serif); color:var(--ink-600); max-width:60ch; }
  .it { font-style:italic; color:var(--clay-600); }
  .meta { font:var(--text-2xs)/1 var(--font-mono); color:var(--ink-400); margin-top:4px; }
</style></head><body>
  <div class="stack">
    <div class="big">Edit your paper, <span class="it">in the page.</span></div>
    <div class="lead">Newsreader carries Stanza's scholarly register — a warm, even text serif with a true italic, drawn for long-form reading on screen.</div>
    <div class="meta">Newsreader · 400 / 500 / 600 · roman + italic · --font-serif</div>
  </div>
</body></html>
