<!-- @dsCard group="Colors" viewport="700x150" name="Clay — Primary Accent" subtitle="The 'Claude inside' warmth · 50 → 800" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-app); padding:18px; }
  .row { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; }
  .sw { border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border-faint); }
  .chip { height:54px; position:relative; }
  .star { position:absolute; top:5px; right:6px; font:var(--weight-bold) 9px/1 var(--font-sans); letter-spacing:.06em; color:var(--paper-1); text-transform:uppercase; }
  .meta { padding:5px 6px; background:var(--paper-1); }
  .name { font:var(--weight-semibold) var(--text-2xs)/1.2 var(--font-mono); color:var(--ink-700); }
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--clay-50)"></div><div class="meta"><div class="name">50</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-100)"></div><div class="meta"><div class="name">100</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-200)"></div><div class="meta"><div class="name">200</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-300)"></div><div class="meta"><div class="name">300</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-400)"></div><div class="meta"><div class="name">400</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-500)"><span class="star">Primary</span></div><div class="meta"><div class="name">500</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-600)"></div><div class="meta"><div class="name">600</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-700)"></div><div class="meta"><div class="name">700</div></div></div>
  </div>
</body></html>
