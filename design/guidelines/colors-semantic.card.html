<!-- @dsCard group="Colors" viewport="700x170" name="Diff & Semantic" subtitle="Muted printer's ink — addition, deletion, warning, info" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-app); padding:18px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .col { border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:hidden; }
  .head { padding:6px 10px; font:var(--weight-semibold) var(--text-xs)/1 var(--font-sans); }
  .pair { display:flex; }
  .pair > div { flex:1; height:38px; }
  .lab { padding:6px 10px; background:var(--paper-1); font:var(--text-2xs)/1.4 var(--font-mono); color:var(--ink-400); border-top:1px solid var(--border-faint); }
</style></head><body>
  <div class="grid">
    <div class="col">
      <div class="head" style="background:var(--add-bg); color:var(--add-700)">+ Addition</div>
      <div class="pair"><div style="background:var(--add-bg)"></div><div style="background:var(--add-600)"></div></div>
      <div class="lab">--add-bg · --add-600</div>
    </div>
    <div class="col">
      <div class="head" style="background:var(--del-bg); color:var(--del-700)">− Deletion</div>
      <div class="pair"><div style="background:var(--del-bg)"></div><div style="background:var(--del-600)"></div></div>
      <div class="lab">--del-bg · --del-600</div>
    </div>
    <div class="col">
      <div class="head" style="background:var(--warn-bg); color:var(--warn-600)">! Warning</div>
      <div class="pair"><div style="background:var(--warn-bg)"></div><div style="background:var(--warn-500)"></div></div>
      <div class="lab">--warn-bg · --warn-500</div>
    </div>
    <div class="col">
      <div class="head" style="background:var(--blue-50); color:var(--blue-700)">i Info</div>
      <div class="pair"><div style="background:var(--blue-50)"></div><div style="background:var(--blue-600)"></div></div>
      <div class="lab">--info-bg · --info-600</div>
    </div>
  </div>
</body></html>
