<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-app); padding:22px; font-family:var(--font-sans); }
  .stack { display:flex; flex-direction:column; gap:8px; }
  .h { font:var(--weight-bold) var(--text-2xl)/1.1 var(--font-sans); letter-spacing:var(--tracking-tight); color:var(--ink-900); }
  .row { display:flex; gap:18px; align-items:baseline; flex-wrap:wrap; }
  .row span { color:var(--ink-700); }
  .w4 { font-weight:400; } .w5 { font-weight:500; } .w6 { font-weight:600; } .w7 { font-weight:700; } .w8 { font-weight:800; }
  .eyebrow { font:var(--weight-bold) var(--text-2xs)/1 var(--font-sans); letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--clay-500); }
  .meta { font:var(--text-2xs)/1 var(--font-mono); color:var(--ink-400); margin-top:4px; }
</style></head><body>
  <div class="stack">
    <div class="eyebrow">Instruction</div>
    <div class="h">Tighten this paragraph and add a forward reference.</div>
    <div class="row">
      <span class="w4">Regular</span><span class="w5">Medium</span><span class="w6">Semibold</span><span class="w7">Bold</span><span class="w8">Black</span>
    </div>
    <div class="meta">Hanken Grotesk · 400 / 500 / 600 / 700 / 800 · --font-sans</div>
  </div>
</body></html>
