<!-- @dsCard group="Colors" viewport="700x150" name="Paper Surfaces" subtitle="Warm parchment surfaces, ascending elevation" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--surface-canvas); padding:18px; }
  .row { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .sw { border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border-default); }
  .chip { height:60px; }
  .meta { padding:7px 9px; background:var(--paper-1); }
  .name { font:var(--weight-semibold) var(--text-xs)/1.2 var(--font-sans); color:var(--ink-800); }
  .val { font:var(--text-2xs)/1.3 var(--font-mono); color:var(--ink-400); margin-top:1px; }
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paper-base)"></div><div class="meta"><div class="name">canvas</div><div class="val">--paper-base</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-0)"></div><div class="meta"><div class="name">app</div><div class="val">--paper-0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-1)"></div><div class="meta"><div class="name">card</div><div class="val">--paper-1</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div class="meta"><div class="name">overlay</div><div class="val">--paper-2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-sunken)"></div><div class="meta"><div class="name">well</div><div class="val">--paper-sunken</div></div></div>
  </div>
</body></html>
