<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Stanza app icon: the in-app StanzaMark (rounded square + three stanza
       lines) as a near-full-bleed tile. The clay rounded square IS the icon
       (transparent outside its corners — no surrounding box); cream lines read
       on the clay. Glyph proportions match StanzaMark.tsx (viewBox 32, rect
       4..28, lines y 11.5/16/20.5, x from 9.5) scaled onto the 960 tile. -->
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d07e58"/>
      <stop offset="1" stop-color="#a94b2e"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#clay)"/>
  <g stroke="#f8f4ec" stroke-width="84" stroke-linecap="round">
    <line x1="252" y1="332" x2="772" y2="332"/>
    <line x1="252" y1="512" x2="632" y2="512"/>
    <line x1="252" y1="692" x2="792" y2="692"/>
  </g>
</svg>
